[package]
name = "rregex"
description = "Rust Regex binding for Javascript"
license = "MIT"
version = "1.10.0"
authors = [ "Fede Ramirez <i@2fd.me>" ]
publish = false
readme = "README.md"
edition = "2018"
homepage = "http://rregex.dev"
repository = "https://github.com/2fd/rregex"

[dependencies]
regex = "=1.13.1"
regex-syntax = "=0.8.11"
# Not used directly: pinned so the regex engine matches the locked regex release
regex-automata = "=0.4.16"
wasm-bindgen = "0.2"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
