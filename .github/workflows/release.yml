name: release

on:
  pull_request:
    branches:
      - master
      - 1.12.x
      - 1.11.x
      - 1.10.x
      - 1.9.x
      - 1.8.x
      - 1.7.x
      - 1.6.x
      - 1.5.x
      - 1.4.x
      - 1.3.x
      - 1.2.x
      - 1.1.x
      - 1.0.x

  push:
    branches:
      - master
      - 1.12.x
      - 1.11.x
      - 1.10.x
      - 1.9.x
      - 1.8.x
      - 1.7.x
      - 1.6.x
      - 1.5.x
      - 1.4.x
      - 1.3.x
      - 1.2.x
      - 1.1.x
      - 1.0.x

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      # cargo registry and dependencies in target/. The key includes the rustc
      # version, so a new Rust on the runner does not restore a stale cache.
      # The benchmark workflow uses the same shared key.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock
      - name: reading wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      # prebuilt binaries: `cargo install` compiles each one in ~1 min
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: installing
        run: pnpm install --frozen-lockfile

      # native binaryen for bin/wasm-opt.sh; rust-cache does not keep it
      - name: reading binaryen version
        id: binaryen
        run: echo "version=$(node -p 'require("./node_modules/binaryen/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: target/binaryen
          key: ${{ runner.os }}-binaryen-${{ steps.binaryen.outputs.version }}

      - name: setup
        run: node --run setup

      - name: building
        run: node --run build

      - uses: actions/upload-artifact@v7
        with:
          name: lib
          path: lib/

  # asks crates.io for the publish dates: in its own job, next to the build
  check_deps:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Cargo.lock
            bin/check-regex-deps.sh
          sparse-checkout-cone-mode: false

      - name: checking regex engine versions
        run: ./bin/check-regex-deps.sh

  # the Rust tests build the crate in the test profile: in their own job, so
  # the build and the jobs that need `lib` do not wait for them
  test_rs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock
      - name: reading wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - run: rustup target add wasm32-unknown-unknown

      - name: testing wasm
        run: node --run test:rs -- --node

  # Each runtime runs every version in one job: the tests take seconds, less
  # than the setup of a runner, and one job per version used ~11 of the
  # concurrent jobs of the account on each PR. A failed version stops the job,
  # like the fail-fast of a matrix.
  test_node:
    runs-on: ubuntu-24.04

    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: node 22
        run: &test-node |
          node --version
          node lib/commonjs.cjs
          node lib/esm.mjs
          node --test test/node.test.cjs
          node --test test/node.test.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: node 24
        run: *test-node

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: node 26
        run: *test-node

  test_bun:
    runs-on: ubuntu-24.04

    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.0"

      - name: bun 1.0
        run: &test-bun |
          bun --version
          bun lib/commonjs.cjs
          bun lib/esm.mjs
          bun test test/bun.test.cjs
          bun test test/bun.test.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"

      - name: bun 1.1
        run: *test-bun

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: bun 1.2
        run: *test-bun

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: bun 1.3
        run: *test-bun

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: bun 1.4
        run: *test-bun

  test_deno:
    runs-on: ubuntu-24.04

    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: deno 1.x
        run: &test-deno |
          deno --version
          deno run --allow-read=lib/rregex.wasm lib/esm.mjs
          deno test --allow-read=lib/rregex.wasm test/deno.test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: deno 2.x
        run: *test-deno

  test_cf:
    runs-on: ubuntu-24.04

    needs: build

    strategy:
      matrix:
        version: ["4.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: test/cf/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib

      - run: pnpm install --frozen-lockfile
        working-directory: ./test/cf

      - run: node --run test
        working-directory: ./test/cf

  publish:

    if: ${{ github.event_name != 'pull_request' }}

    runs-on: ubuntu-24.04

    environment:
      name: release
      url: ${{ steps.release_url.outputs.url }}

    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance

    needs:
      - check_deps
      - test_rs
      - test_node
      - test_bun
      - test_deno
      - test_cf

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - uses: actions/download-artifact@v8
        with:
          name: lib
          path: lib

      - run: pnpm install --frozen-lockfile

      - run: node --run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: set release url
        id: release_url
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0-development" ]; then
            echo "url=https://www.npmjs.com/package/rregex" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.npmjs.com/package/rregex/v/$version" >> "$GITHUB_OUTPUT"
          fi
