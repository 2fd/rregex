name: benchmark

# Runs the benchmarks of the PR against its base branch and posts the report
# as a PR comment (one comment, kept up to date). PRs from forks and dependabot
# get a read-only token, so the `benchmark comment` workflow posts for them.

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "bin/build.sh"
      - "bin/bench-compare.mjs"
      - ".github/scripts/benchmark-comment.cjs"
      - ".github/workflows/benchmark.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      # head must be checked out first: checkout cleans the workspace root
      - uses: actions/checkout@v7

      # same paths and key as the release workflow, so the cache of master is reused
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # prebuilt binary: `cargo install wasm-pack` compiles it in ~1 min
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .base/pnpm-lock.yaml

      - name: setup
        run: |
          pnpm install --frozen-lockfile
          node --run setup
          # build.sh runs 4 wasm-pack builds in parallel: if the target is
          # missing, their concurrent `rustup target add` calls collide
          rustup target add wasm32-unknown-unknown

      # build.sh does not stop on errors, so check that the lib is complete
      - name: building head
        run: |
          node --run build
          test -f lib/esm.mjs -a -f lib/rregex.wasm

      - name: building base
        working-directory: .base
        env:
          # share compiled dependencies with the head build
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          pnpm install --frozen-lockfile
          node --run build
          test -f lib/esm.mjs -a -f lib/rregex.wasm

      - name: running benchmarks
        run: |
          REPORT_DIR="$RUNNER_TEMP/benchmark"
          mkdir -p "$REPORT_DIR"
          node bin/bench-compare.mjs \
            --base .base/lib \
            --head lib \
            --base-label "\`${BASE_SHA::7}\` (${GITHUB_BASE_REF})" \
            --head-label "\`${HEAD_SHA::7}\`" \
            --markdown "$REPORT_DIR/report.md" \
            --json "$REPORT_DIR/results.json"
          cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark
          retention-days: 7

  comment:
    # PRs from this repository only, see `benchmark comment` for the others
    if: >-
      !cancelled() && needs.benchmark.result != 'skipped' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    needs: benchmark

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write # to create and update the comment

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        if: needs.benchmark.result == 'success'
        with:
          name: benchmark
          path: ${{ runner.temp }}/benchmark

      - uses: actions/github-script@v9
        env:
          SUCCESS: ${{ needs.benchmark.result == 'success' }}
        with:
          script: |
            await require('./.github/scripts/benchmark-comment.cjs')({
              github,
              context,
              core,
              pr: context.payload.pull_request.number,
              sha: context.payload.pull_request.head.sha,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              success: process.env.SUCCESS === 'true',
              reportPath: `${process.env.RUNNER_TEMP}/benchmark/report.md`,
            });
